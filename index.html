<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>背单词 · 双栏 + 生词本</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --line:#e5e7eb; --text:#111827; --sub:#6b7280;
    --primary:#2563eb; --primary-weak:#eff6ff; --green:#059669; --green-weak:#ecfdf5;
    --danger:#dc2626; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .app{max-width:1120px;margin:0 auto;padding:12px 12px 90px}
  header.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .title{font-size:18px;font-weight:700;margin-right:auto}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;
    padding:7px 12px;font-size:13px;cursor:pointer;line-height:1.2;white-space:nowrap}
  .btn:hover{background:#f9fafb}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--danger);border-color:#fecaca}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:10px}
  .toolbar input[type=search], .toolbar select{
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;color:var(--text)}
  .toolbar input[type=search]{flex:1 1 220px;min-width:160px}
  .chkbox{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#4b5563;white-space:nowrap;cursor:pointer}
  .chkbox input{accent-color:var(--primary);width:14px;height:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:780px){
    .grid{grid-template-columns:1fr}
    .col-body{max-height:none}
    .nb-body{max-height:none}
    .title{width:100%}
    .toolbar input[type=search]{flex:1 1 100%}
  }
  .col{background:#fff;border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:220px}
  .col-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .col-head .name{font-weight:600;font-size:14px}
  .col-head .count{font-size:12px;color:var(--sub)}
  .col-head .spacer{flex:1}
  .col-tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px dashed var(--line);background:#fcfcfd}
  .sel-info{font-size:12px;color:var(--sub);align-self:center;margin-right:auto}
  #accentSel{width:auto;flex:0 0 auto;padding:8px 24px 8px 10px;font-size:13px}
  .pills{display:inline-flex;gap:6px;align-items:center;flex:0 0 auto}
  .pill{border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:4px 11px;
    font-size:12px;color:#6b7280;cursor:pointer;transition:.15s;line-height:1.4}
  .pill:hover{border-color:#c7d2fe}
  .pill.on{background:#eff6ff;border-color:#93c5fd;color:#2563eb;font-weight:600}
  .hide-mn .mn{display:none !important}
  .col-body{padding:8px;display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
  .card{position:relative;display:flex;gap:9px;align-items:flex-start;
    border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--card)}
  .card.sel{border-color:var(--primary);background:var(--primary-weak)}
  .card .chk{width:17px;height:17px;margin-top:3px;accent-color:var(--primary);flex:none;cursor:pointer}
  .card .body{flex:1;min-width:0;cursor:default;-webkit-user-select:none;user-select:none}
  .card .wrow{display:flex;align-items:center;gap:6px}
  .card .w{font-weight:650;font-size:15px;word-break:break-word}
  .spk{border:none;background:transparent;cursor:pointer;padding:0 3px;line-height:1;flex:none;
    color:#9ca3af;display:inline-flex;align-items:center}
  .spk:hover{color:var(--primary)}
  .spk:active{transform:scale(.9)}
  .card .ph{color:var(--sub);font-size:12px;font-style:italic;margin-top:1px;word-break:break-word}
  .card .ph.no-data, .card .mn.no-data{color:#c0c4cc;font-style:normal;font-size:12px}
  .card .mn{font-size:13px;color:#374151;margin-top:5px;line-height:1.45;word-break:break-word}
  /* 右栏：默认隐藏释义，长按显示 */
  .col.done .card .mn{display:none}
  .col.done .card.hide-w .wrow{display:none !important}
  .col.done .card.hide-ph .ph{display:none !important}
  .col.done .card.show-mn .mn{display:block}
  .col.done .hint{display:inline-block;font-size:11px;color:#9ca3af;margin-top:4px}
  .col.done .card.reveal .hint{display:none !important}
  /* 长按时把隐藏的内容全部显示出来（放在最后，优先级最高） */
  .col.done .card.reveal .wrow{display:flex !important}
  .col.done .card.reveal .ph{display:block !important}
  .col.done .card.reveal .mn{display:block !important}
  /* 关闭遮挡时全部常显 */
  .col.done .card.show-w .wrow{display:flex}
  .col.done .card.show-ph .ph{display:block}
  .card .quick{position:absolute;right:8px;top:8px;border:1px solid var(--line);background:#fff;
    border-radius:7px;font-size:11px;padding:3px 7px;cursor:pointer;color:var(--sub)}
  .card .quick:hover{background:#f3f4f6}
  .card .star{position:absolute;right:8px;bottom:8px;border:none;background:transparent;cursor:pointer;font-size:14px;color:#d1d5db}
  .card .star.on{color:#f59e0b}
  .pos{display:inline-block;font-style:italic;color:#9ca3af;margin-right:5px;font-size:12px}
  .card .edit{position:absolute;right:34px;bottom:8px;border:none;background:transparent;
    cursor:pointer;font-size:13px;color:#d1d5db;padding:0 2px;line-height:1}
  .card .edit:hover{color:var(--primary)}
  .empty{padding:24px 12px;text-align:center;color:var(--sub);font-size:13px}

  /* 生词本 */
  .nb{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
  .nb-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
  .nb-head .name{font-weight:650;font-size:14px;margin-right:auto}
  .nb-body{padding:8px;display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow:auto}
  .nb-day{font-size:12px;color:var(--sub);font-weight:600;padding:6px 4px 0}
  .nb-item{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .nb-item .body{flex:1;min-width:0}
  .nb-item .w{font-weight:600;font-size:14px}
  .nb-item .ph{font-size:12px;color:var(--sub);font-style:italic}
  .nb-item .mn{font-size:12.5px;color:#374151;margin-top:3px}

  /* 弹窗 / 提示 */
  .mask{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:82vh;
    padding:16px;display:flex;flex-direction:column;overflow:hidden}
  .modal h3{margin:0 0 10px;font-size:16px;flex:none}
  .modal .msg{flex:1;min-height:0;overflow:auto;font-size:13px;color:#374151;
    white-space:normal;line-height:1.65;padding-right:4px}
  .modal .msg .err{color:#b91c1c}
  .modal .actions{flex:none;display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
  .modal input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-size:14px;margin-top:8px;background:#fff;color:var(--text)}
  .modal input[type=checkbox]{width:16px;height:16px;min-width:16px;margin:0;padding:0;border:none;
    accent-color:var(--primary);flex:none}
  .folder-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .folder-list label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;font-size:13px}
  /* 显示设置里的选项行：整行可点，手机也好按 */
  .opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;
    padding:11px 12px;cursor:pointer;font-size:13px;background:#fff;user-select:none;-webkit-user-select:none}
  .opt + .opt{margin-top:8px}
  .opt:active{background:#f3f4f6}
  .opt span{flex:1;line-height:1.4}
  .opt.disabled{opacity:.4;pointer-events:none;background:#f9fafb}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#111827;color:#fff;
    padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
  .toast.show{opacity:1}
  .hidden{display:none !important}
  body.dragging::after{content:"松开即可导入";position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;font-size:20px;color:#2563eb;background:rgba(239,246,255,.85);border:3px dashed #2563eb;pointer-events:none}

  /* 生词本条目：按显示设置隐藏 / 长按展开 */
  .nb-item.hide-w .wrow{display:none !important}
  .nb-item.hide-ph .ph{display:none !important}
  .nb-item.hide-mn .mn{display:none !important}
  .nb-item.reveal .wrow{display:flex !important}
  .nb-item.reveal .ph{display:block !important}
  .nb-item.reveal .mn{display:block !important}
  .nb-item .hint{display:inline-block;font-size:11px;color:#9ca3af;margin-top:2px}
  .nb-item.reveal .hint{display:none !important}

  .card .body,.nb-item .body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title">背单词</div>
    <button class="btn" id="btnHelp">使用说明</button>
    <button class="btn" id="btnImport">导入词书</button>
    <button class="btn" id="btnImportFolder">导入文件夹</button>
    <button class="btn" id="btnExport">导出备份</button>
    <button class="btn" id="btnRestore">导入备份</button>
    <button class="btn" id="btnAdd">＋ 单词</button>
    <button class="btn" id="btnRenameDay">重命名批次</button>
    <button class="btn" id="btnPhonetic">补音标</button>
    <button class="btn danger" id="btnClear">清空数据</button>
  </header>

  <div class="toolbar">
    <select id="daySelect" title="按日期筛选"></select>
    <input type="search" id="searchInput" placeholder="搜索单词或释义…">
    <label class="chkbox" title="系统没有英文语音时，用在线发音代替（需联网）">
      <input type="checkbox" id="onlineTts" checked> 在线发音
    </label>
    <select id="accentSel" title="在线发音口音">
      <option value="2">美音</option>
      <option value="1">英音</option>
    </select>
    <span class="sel-info" id="totalInfo"></span>
  </div>

  <div class="grid">
    <section class="col learning" id="colLearning">
      <div class="col-head">
        <span class="name">正在学</span>
        <span class="count" id="cntLearning">0</span>
        <span class="spacer"></span>
        <button class="btn ghost" id="selAllLearning">全选</button>
      </div>
      <div class="col-tools">
        <span class="sel-info" id="selInfoLearning">未选择</span>
        <button class="btn" id="addNotebook" disabled>☆ 加入生词本</button>
        <button class="btn primary" id="moveToDone" disabled>移到已完成 →</button>
      </div>
      <div class="col-body" id="bodyLearning"></div>
    </section>

    <section class="col done" id="colDone">
      <div class="col-head">
        <span class="name">已完成</span>
        <span class="count" id="cntDone">0</span>
        <span class="spacer"></span>
        <span class="pills" id="donePills">
          <button class="pill" data-k="w" type="button">英语</button>
          <button class="pill" data-k="ph" type="button">音标</button>
          <button class="pill" data-k="mn" type="button">汉语</button>
        </span>
        <button class="btn ghost" id="selAllDone">全选</button>
      </div>
      <div class="col-tools">
        <span class="sel-info" id="selInfoDone">未选择</span>
        <button class="btn" id="addNotebookDone" disabled>☆ 加入生词本</button>
        <button class="btn primary" id="moveToLearning" disabled>← 移到正在学</button>
      </div>
      <div class="col-body" id="bodyDone"></div>
    </section>
  </div>

  <section class="nb">
    <div class="nb-head">
      <span class="name">生词本</span>
      <select id="folderSelect" title="切换文件夹"></select>
      <button class="btn" id="btnNewFolder">新建文件夹</button>
      <button class="btn danger" id="btnDelFolder">删除文件夹</button>
      <span class="pills" id="nbPills">
        <button class="pill" data-k="w" type="button">英语</button>
        <button class="pill" data-k="ph" type="button">音标</button>
        <button class="pill" data-k="mn" type="button">汉语</button>
      </span>
      <select id="nbDaySelect" title="按天筛选生词"></select>
    </div>
    <div class="nb-body" id="nbBody"></div>
  </section>
</div>

<input type="file" id="fileImport" accept=".csv,.xlsx,.xls,.txt,.tsv,.json" multiple class="hidden">
<input type="file" id="folderImport" accept=".csv,.xlsx,.xls,.txt,.tsv,.json" webkitdirectory multiple class="hidden">
<input type="file" id="fileRestore" accept=".json" class="hidden">
<div id="toast" class="toast"></div>

<script>
'use strict';

/* ============================ 常量 & 工具 ============================ */
const DB_NAME = 'vocab_db_v2';   // 独立命名空间，不与旧版互通
const DB_VERSION = 1;
const DEFAULT_FOLDER = 'default';

const state = {
  day: '',          // '' = 全部
  keyword: '',
  folder: DEFAULT_FOLDER,
  nbDay: '',        // 生词本按天筛选
  onlineTts: true,  // 无英文语音时是否用在线发音
  doneShow: { w: true, ph: true, mn: false },   // 已完成栏：显示哪些
  nbShow: { w: true, ph: true, mn: true },      // 生词本：显示哪些
  accent: 2,        // 在线发音口音：1=英音 2=美音
  words: [],        // 全量内存缓存
  folders: [],
  sel: { learning: new Set(), done: new Set() }
};

const $ = (id) => document.getElementById(id);
const SPK_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>' +
  '<path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>';
const toastEl = $('toast');
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ============================ IndexedDB ============================ */
let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('words')) {
        const s = db.createObjectStore('words', { keyPath: 'id' });
        s.createIndex('day', 'day');
        s.createIndex('status', 'status');
        s.createIndex('folderId', 'folderId');
      }
      if (!db.objectStoreNames.contains('notebooks')) {
        db.createObjectStore('notebooks', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('meta')) {
        db.createObjectStore('meta', { keyPath: 'k' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function tx(store, mode) {
  return openDB().then(db => {
    const t = db.transaction(store, mode);
    return { t, s: t.objectStore(store) };
  });
}

function reqToPromise(req) {
  return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
}

async function dbGetAll(store) {
  const { s } = await tx(store, 'readonly');
  return reqToPromise(s.getAll());
}

async function dbPutMany(store, items) {
  const { t, s } = await tx(store, 'readwrite');
  items.forEach(it => s.put(it));
  return new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
}

async function dbDeleteMany(store, keys) {
  const { t, s } = await tx(store, 'readwrite');
  keys.forEach(k => s.delete(k));
  return new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
}

async function dbClear(store) {
  const { t, s } = await tx(store, 'readwrite');
  s.clear();
  return new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
}

/* ============================ 朗读（浏览器内置 TTS） ============================ */
const tts = {
  ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  voice: null,
  hasEn: false,
  hinted: false,
  pick() {
    if (!this.ok) return;
    const vs = window.speechSynthesis.getVoices() || [];
    const en = vs.filter(v => /^en/i.test(v.lang));
    this.hasEn = en.length > 0;
    this.voice =
      en.find(v => /en[-_]US/i.test(v.lang) && /google|natural|siri|zira|aria|jenny/i.test(v.name)) ||
      en.find(v => /en[-_]US/i.test(v.lang)) ||
      en[0] ||
      null;
  }
};
if (tts.ok) {
  tts.pick();
  if (typeof window.speechSynthesis.addEventListener === 'function') {
    window.speechSynthesis.addEventListener('voiceschanged', () => tts.pick());
  } else {
    window.speechSynthesis.onvoiceschanged = () => tts.pick();
  }
}

function localSpeak(text) {
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'en-US';
    u.rate = 0.9;
    u.pitch = 1;
    if (tts.voice) u.voice = tts.voice;
    window.speechSynthesis.speak(u);
  } catch (e) {
    toast('朗读失败：' + (e.message || e));
  }
}

/* 在线发音（系统缺英文语音时使用，需联网） */
let curAudio = null;
const audioCache = new Map();

function playOnline(text) {
  return new Promise((resolve, reject) => {
    const key = (state.accent || 2) + '|' + text;
    let a = audioCache.get(key);
    if (!a) {
      a = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) +
        '&type=' + (state.accent || 2));
      a.preload = 'auto';
    }
    curAudio = a;
    let done = false;
    const fin = (ok) => {
      if (done) return;
      done = true;
      clearTimeout(tm);
      a.removeEventListener('playing', onP);
      a.removeEventListener('error', onE);
      ok ? resolve() : reject(new Error('audio'));
    };
    const tm = setTimeout(() => { try { a.pause(); } catch (e) { } fin(false); }, 4000);
    const onP = () => {
      audioCache.set(key, a);
      if (audioCache.size > 150) audioCache.delete(audioCache.keys().next().value);
      fin(true);
    };
    const onE = () => fin(false);
    a.addEventListener('playing', onP);
    a.addEventListener('error', onE);
    try {
      a.currentTime = 0;
      const p = a.play();
      if (p && p.catch) p.catch(onE);
    } catch (e) { fin(false); }
  });
}

function stopSpeak() {
  try {
    if (curAudio) { curAudio.pause(); curAudio.currentTime = 0; }
    if (tts.ok) window.speechSynthesis.cancel();
  } catch (e) { }
}

let speaking = false;
async function speak(text) {
  if (!text) return;
  if (speaking) { stopSpeak(); speaking = false; return; }   // 正在读 → 再点一次停止
  if (!tts.ok && !state.onlineTts) { toast('当前浏览器不支持朗读'); return; }
  tts.pick();
  speaking = true;
  try {
    if (tts.hasEn) { localSpeak(text); return; }
    if (state.onlineTts) {
      try {
        await playOnline(text);
        if (!tts.onlineHinted) {
          tts.onlineHinted = true;
          toast('系统未装英文语音，已改用在线发音');
        }
        return;
      } catch (e) { /* 网络不可用时退回本地 */ }
    }
    if (!tts.hinted) {
      tts.hinted = true;
      toast('系统未装英文语音，发音可能不准（可加装英语语音包）');
    }
    localSpeak(text);
  } finally {
    setTimeout(() => { speaking = false; }, 600);
  }
}

async function dbGet(store, key) {
  const { s } = await tx(store, 'readonly');
  return reqToPromise(s.get(key));
}

/* ============================ 数据加载 ============================ */
async function reloadAll() {
  const [words, folders, ui, batches] = await Promise.all([
    dbGetAll('words'), dbGetAll('notebooks'), dbGet('meta', 'ui'), dbGet('meta', 'batches')
  ]);
  state.words = words;
  state.batchNames = (batches && Array.isArray(batches.list)) ? batches.list : [];
  const daysFromWords = [...new Set(words.map(w => String(w.day)).filter(Boolean))];
  daysFromWords.forEach(d => { if (!state.batchNames.includes(d)) state.batchNames.push(d); });
  state.folders = folders.length ? folders : [{ id: DEFAULT_FOLDER, name: '默认', createdAt: Date.now() }];
  if (!folders.length) await dbPutMany('notebooks', state.folders);
  if (ui && typeof ui.onlineTts === 'boolean') {
    state.onlineTts = ui.onlineTts;
    const cb = $('onlineTts');
    if (cb) cb.checked = ui.onlineTts;
  }
  if (ui && (ui.accent === 1 || ui.accent === 2)) {
    state.accent = ui.accent;
  }
  const accSel = $('accentSel');
  if (accSel) accSel.value = String(state.accent || 2);
  if (ui && ui.doneShow && typeof ui.doneShow === 'object') {
    const d = ui.doneShow;
    state.doneShow.w = d.w !== false;
    state.doneShow.ph = d.ph !== false;
    state.doneShow.mn = d.mn === true || (d.hide === false);
  }
  if (ui && ui.nbShow && typeof ui.nbShow === 'object') {
    const n = ui.nbShow;
    state.nbShow.w = n.w !== false;
    state.nbShow.ph = n.ph !== false;
    state.nbShow.mn = n.mn !== false;
  }
  updateDoneShowLabel();
  renderAll();
}

function saveUi() {
  return dbPutMany('meta', [{ k: 'ui', onlineTts: state.onlineTts, doneShow: state.doneShow, nbShow: state.nbShow, accent: state.accent }]);
}

function updateDoneShowLabel() {
  syncPills('donePills', state.doneShow);
  syncPills('nbPills', state.nbShow);
}

function syncPills(id, st) {
  const box = $(id);
  if (!box) return;
  box.querySelectorAll('.pill').forEach(b => {
    b.classList.toggle('on', !!st[b.dataset.k]);
  });
}


/* ============================ 渲染 ============================ */
function currentFilter() {
  const kw = state.keyword.trim().toLowerCase();
  return state.words.filter(w => {
    if (state.day && String(w.day) !== String(state.day)) return false;
    if (kw) {
      const hay = (w.word + ' ' + w.meaning).toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  });
}

function sortWords(list) {
  return list.slice().sort((a, b) => {
    const d = natCompare(String(a.day), String(b.day));
    if (d !== 0) return d;
    return (a.createdAt || 0) - (b.createdAt || 0);
  });
}

/* 按“显示设置”隐藏卡片里的字段 */
function applyShow(card, st) {
  card.classList.toggle('hide-w', !st.w);
  card.classList.toggle('hide-ph', !st.ph);
  card.classList.toggle('hide-mn', !st.mn);
  card.classList.toggle('show-mn', !!st.mn);
}

function hiddenOf(st) {
  const a = [];
  if (!st.w) a.push('英语');
  if (!st.ph) a.push('音标');
  if (!st.mn) a.push('汉语');
  return a;
}

function attachReveal(card, body, hiddenLabels) {
  const hint = document.createElement('span');
  hint.className = 'hint';
  hint.textContent = hiddenLabels.length ? '长按查看：' + hiddenLabels.join('、') : '';
  body.appendChild(hint);
  if (!hiddenLabels.length) return;
  let timer = null;
  const show = () => card.classList.add('reveal');
  const hide = () => card.classList.remove('reveal');
  body.addEventListener('pointerdown', () => { timer = setTimeout(show, 320); });
  body.addEventListener('pointerup', () => { clearTimeout(timer); hide(); });
  body.addEventListener('pointerleave', () => { clearTimeout(timer); hide(); });
  body.addEventListener('pointercancel', () => { clearTimeout(timer); hide(); });
  body.addEventListener('contextmenu', e => e.preventDefault());
}

function makeCard(w, isDone) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = w.id;

  const chk = document.createElement('input');
  chk.type = 'checkbox';
  chk.className = 'chk';
  chk.checked = state.sel[isDone ? 'done' : 'learning'].has(w.id);
  if (chk.checked) card.classList.add('sel');
  chk.addEventListener('change', () => {
    const set = state.sel[isDone ? 'done' : 'learning'];
    if (chk.checked) set.add(w.id); else set.delete(w.id);
    card.classList.toggle('sel', chk.checked);
    updateSelUI();
  });
  // 复选框上长按不触发释义
  chk.addEventListener('pointerdown', e => e.stopPropagation());

  const body = document.createElement('div');
  body.className = 'body';
  body.innerHTML =
    '<div class="wrow"><span class="w"></span>' +
    '<button class="spk" type="button" title="朗读" aria-label="朗读">' + SPK_SVG + '</button></div>' +
    '<div class="ph"></div><div class="mn"></div>';
  body.querySelector('.w').textContent = w.word;
  const phEl = body.querySelector('.ph');
  if (w.phonetic) {
    phEl.textContent = w.phonetic;
  } else {
    phEl.textContent = '（无音标）';
    phEl.classList.add('no-data');
  }
  const mnEl = body.querySelector('.mn');
  if (w.pos) {
    const ps = document.createElement('span');
    ps.className = 'pos';
    ps.textContent = w.pos;
    mnEl.appendChild(ps);
  }
  if (w.meaning) {
    mnEl.appendChild(document.createTextNode(w.meaning));
  } else if (!w.pos) {
    mnEl.textContent = '（无释义）';
    mnEl.classList.add('no-data');
  }

  const spk = body.querySelector('.spk');
  spk.addEventListener('click', (e) => { e.stopPropagation(); speak(w.word); });
  spk.addEventListener('pointerdown', (e) => e.stopPropagation());
  if (!isDone) {
    body.querySelector('.w').addEventListener('click', () => speak(w.word));
  }

  if (isDone) {
    applyShow(card, state.doneShow);
    const hiddenLabels = hiddenOf(state.doneShow);
    const hint = document.createElement('span');
    hint.className = 'hint';
    hint.textContent = hiddenLabels.length ? '长按查看：' + hiddenLabels.join('、') : '';
    body.appendChild(hint);
    // 长按显示释义
    let timer = null;
    const show = () => { card.classList.add('reveal'); };
    const hide = () => { card.classList.remove('reveal'); };
    body.addEventListener('pointerdown', () => { timer = setTimeout(show, 320); });
    body.addEventListener('pointerup', () => { clearTimeout(timer); hide(); });
    body.addEventListener('pointerleave', () => { clearTimeout(timer); hide(); });
    body.addEventListener('pointercancel', () => { clearTimeout(timer); hide(); });
    body.addEventListener('contextmenu', e => e.preventDefault());
  }

  const quick = document.createElement('button');
  quick.className = 'quick';
  quick.type = 'button';
  quick.title = isDone ? '移回正在学' : '移到已完成';
  quick.textContent = isDone ? '←' : '→';
  quick.addEventListener('click', async (e) => {
    e.stopPropagation();
    await moveWords([w.id], isDone ? 'learning' : 'done');
  });

  const star = document.createElement('button');
  star.className = 'star' + (w.folderId ? ' on' : '');
  star.type = 'button';
  star.title = '加入生词本';
  star.textContent = w.folderId ? '★' : '☆';
  star.addEventListener('click', (e) => { e.stopPropagation(); openFolderPicker([w.id]); });

  const edit = document.createElement('button');
  edit.className = 'edit';
  edit.type = 'button';
  edit.title = '编辑 / 删除';
  edit.textContent = '✎';
  edit.addEventListener('click', (e) => { e.stopPropagation(); openWordEditor(w); });

  card.append(chk, body, quick, star, edit);
  return card;
}

function renderColumns() {
  const list = sortWords(currentFilter());
  const learning = list.filter(w => w.status !== 'done');
  const done = list.filter(w => w.status === 'done');

  const bl = $('bodyLearning'), bd = $('bodyDone');
  bl.innerHTML = ''; bd.innerHTML = '';

  if (!learning.length) bl.innerHTML = '<div class="empty">暂无单词</div>';
  else learning.forEach(w => bl.appendChild(makeCard(w, false)));

  if (!done.length) bd.innerHTML = '<div class="empty">暂无单词</div>';
  else done.forEach(w => bd.appendChild(makeCard(w, true)));

  $('cntLearning').textContent = learning.length;
  $('cntDone').textContent = done.length;
  $('totalInfo').textContent = `共 ${state.words.length} 词 · 当前筛选 ${list.length}`;
  updateSelUI();
}

function renderDaySelect() {
  updateDaySelect();
}

function renderFolders() {
  const sel = $('folderSelect');
  sel.innerHTML = state.folders.map(f =>
    `<option value="${escapeAttr(f.id)}">${escapeHtml(f.name)}</option>`).join('');
  if (!state.folders.some(f => f.id === state.folder)) state.folder = state.folders[0].id;
  sel.value = state.folder;
}

function renderNotebook() {
  const box = $('nbBody');
  let items = state.words.filter(w => w.folderId === state.folder);
  if (state.nbDay) items = items.filter(w => String(w.day) === String(state.nbDay));
  items = sortWords(items);

  if (!items.length) {
    box.innerHTML = '<div class="empty">这个文件夹还没有生词</div>';
    return;
  }
  box.innerHTML = '';
  let lastDay = null;
  items.forEach(w => {
    const d = String(w.day);
    if (d !== lastDay) {
      lastDay = d;
      const h = document.createElement('div');
      h.className = 'nb-day';
      h.textContent = d;
      box.appendChild(h);
    }
    const row = document.createElement('div');
    row.className = 'nb-item';
    row.innerHTML = '<div class="body"><div class="wrow"><span class="w"></span>' +
      '<button class="spk" type="button" title="朗读" aria-label="朗读">' + SPK_SVG + '</button></div>' +
      '<div class="ph"></div><div class="mn"></div></div>';
    row.querySelector('.w').textContent = w.word;
    row.querySelector('.ph').textContent = w.phonetic || '';
    const nbMn = row.querySelector('.mn');
    if (w.pos) {
      const ps2 = document.createElement('span');
      ps2.className = 'pos';
      ps2.textContent = w.pos;
      nbMn.appendChild(ps2);
    }
    nbMn.appendChild(document.createTextNode(w.meaning || ''));
    applyShow(row, state.nbShow);

      await dbPutMany('words', [upd]);

function renderAll() {

}

function visibleIds(isDone) {
  return sortWords(currentFilter())
    .filter(w => (w.status === 'done') === isDone)

}

function updateSelUI() {
  const L = state.sel.learning, D = state.sel.done;
  $('selInfoLearning').textContent = L.size ? `已选 ${L.size} 项` : '未选择';
  $('selInfoDone').textContent = D.size ? `已选 ${D.size} 项` : '未选择';

  $('moveToLearning').disabled = D.size === 0;

async function moveWords(ids, target) {
  if (!ids.length) return;
  const map = new Map(state.words.map(w => [w.id, w]));
  const upd = ids.filter(id => map.has(id)).map(id => ({ ...map.get(id), status: target }));
  await dbPutMany('words', upd);
  state.sel.learning.clear();
  state.sel.done.clear();
  await reloadAll();
  toast(`已移动 ${upd.length} 个单词`);
}

/* ============================ 生词本操作 ============================ */
function openModal({ title, bodyHTML, input, actions }) {
  const mask = document.createElement('div');
  mask.className = 'mask';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `<h3></h3><div class="msg"></div>`;
  modal.querySelector('h3').textContent = title;
  if (bodyHTML) modal.querySelector('.msg').innerHTML = bodyHTML;
  let inputEl = null;
  if (input) {
    inputEl = document.createElement('input');
    inputEl.type = 'text';
    inputEl.placeholder = input.placeholder || '';
    inputEl.value = input.value || '';
    modal.appendChild(inputEl);
  }
  const acts = document.createElement('div');
  acts.className = 'actions';
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : '');
    b.textContent = a.text;
    b.addEventListener('click', () => {
      // 先执行回调（回调里通常要读取弹窗内的表单值），再移除弹窗
      try {
        if (a.validate && a.validate(inputEl, modal) === false) return;
        if (a.onClick) a.onClick(inputEl, modal);
      } catch (e) { console.error(e); }
      setTimeout(() => mask.remove(), 0);
    });
    acts.appendChild(b);
  });
  modal.appendChild(acts);
  mask.appendChild(modal);
  mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
  document.body.appendChild(mask);
  if (inputEl) setTimeout(() => inputEl.focus(), 30);
  return mask;
}

function openFolderPicker(ids) {
  if (!ids.length) return;
  const listHTML = state.folders.map(f =>
    `<label><input type="radio" name="fid" value="${escapeAttr(f.id)}" ${f.id === state.folder ? 'checked' : ''}>
      ${escapeHtml(f.name)}</label>`).join('');
  const mask = openModal({
    title: `把 ${ids.length} 个单词加入生词本`,
    bodyHTML: `<div class="folder-list">${listHTML}</div>`,
    actions: [
      { text: '取消' },
      { text: '确定加入', primary: true, onClick: async () => {
          const checked = document.querySelector('input[name=fid]:checked');
          const fid = checked ? checked.value : state.folder;
          const map = new Map(state.words.map(w => [w.id, w]));
          const upd = ids.filter(id => map.has(id)).map(id => ({ ...map.get(id), folderId: fid }));
          await dbPutMany('words', upd);
          state.sel.learning.clear();
          state.sel.done.clear();
          await reloadAll();
          toast(`已加入生词本（${upd.length} 个）`);
        } }
    ]
  });
}

async function newFolder() {
  const mask = openModal({
    title: '新建生词本文件夹',
    input: { placeholder: '例如：难词、四级核心' },
    actions: [
      { text: '取消' },
      { text: '创建', primary: true, onClick: async (el) => {
          const name = (el.value || '').trim();
          if (!name) return toast('名字不能为空');
          const id = 'f_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          await dbPutMany('notebooks', [{ id, name, createdAt: Date.now() }]);
          state.folder = id;
          await reloadAll();
          toast('已创建文件夹');

    ]
  });
}

async function delFolder() {
  if (state.folder === DEFAULT_FOLDER) return toast('默认文件夹不能删除');
  const f = state.folders.find(x => x.id === state.folder);
  openModal({
    title: '删除文件夹',
    bodyHTML: `确定删除「${escapeHtml(f ? f.name : '')}」？其中的单词会移出生词本。`,
    actions: [
      { text: '取消' },
      { text: '删除', danger: true, onClick: async () => {
          const affected = state.words.filter(w => w.folderId === state.folder)
            .map(w => ({ ...w, folderId: null }));
          if (affected.length) await dbPutMany('words', affected);
          await dbDeleteMany('notebooks', [state.folder]);
          state.folder = DEFAULT_FOLDER;
          await reloadAll();
          toast('文件夹已删除');
        } }
    ]
  });
}

/* ============================ 导入词书 ============================ */
const HEADER_MAP = {
  day: ['day', 'date', '日期', '天', '天数'],
  word: ['word', '单词', '词汇'],
  phonetic: ['phonetic', 'phonetics', '音标', '发音'],
  meaning: ['meaning', '释义', '中文', '意思', '翻译', '中文释义'],
  pos: ['pos', 'partofspeech', '词性', '词类', '词性标注']
};

function normalizeHeader(h) {
  return String(h || '').trim().toLowerCase().replace(/[\s_\-]/g, '');
}

function mapHeaders(headerRow) {
  const idx = {};
  headerRow.forEach((h, i) => {
    const n = normalizeHeader(h);
    for (const [key, aliases] of Object.entries(HEADER_MAP)) {
      if (idx[key] === undefined && aliases.some(a => normalizeHeader(a) === n)) idx[key] = i;
    }
  });
  return idx;
}

/* 按需加载 SheetJS */
function loadSheetJS() {
  return new Promise((resolve, reject) => {
    if (window.XLSX) return resolve(window.XLSX);
    const cdns = [
      'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
      'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
    ];
    let i = 0;
    const tryNext = () => {
      if (i >= cdns.length) return reject(new Error(
        '无法加载 Excel 解析库（SheetJS）。\n\n可能原因：没有联网、或网络被拦截。\n建议：把表格另存为 CSV 再导入，CSV 不需要联网。'));
      const s = document.createElement('script');
      s.src = cdns[i++];
      s.onload = () => window.XLSX ? resolve(window.XLSX) : tryNext();
      s.onerror = () => tryNext();
      document.head.appendChild(s);
    };
    tryNext();
  });
}

/* ============================ 批次（day）与自然排序 ============================ */
function pad2(n) { return String(n).padStart(2, '0'); }

/* 自然排序：11.15-2 排在 11.15-10 前面 */
function natCompare(a, b) {
  const re = /(\d+)|(\D+)/g;
  const ax = String(a).match(re) || [];
  const bx = String(b).match(re) || [];
  for (let i = 0; i < Math.min(ax.length, bx.length); i++) {
    const A = ax[i], B = bx[i];
    const na = /^\d+$/.test(A), nb = /^\d+$/.test(B);
    if (na && nb) {
      const d = Number(A) - Number(B);
      if (d !== 0) return d;
    } else {
      const d = A.localeCompare(B, 'zh-Hans-CN');
      if (d !== 0) return d;
    }
  }
  return ax.length - bx.length;
}

/* 从文件名推断批次名（= 日期），认不出就用文件名 */
function batchNameFromFile(filename) {
  const stem = String(filename).replace(/\.[^.]+$/, '').trim();
  let m = stem.match(/(20\d{2})\s*[.\-_年]\s*(\d{1,2})\s*[.\-_月]\s*(\d{1,2})/);
  if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = stem.match(/(?:^|[^\d])(\d{1,2})\s*[.\-_\/月]\s*(\d{1,2})\s*日?/);
  if (m) return `${pad2(m[1])}.${pad2(m[2])}`;
  m = stem.match(/^(\d{2})(\d{2})$/);
  if (m) {
    const mo = Number(m[1]), dd = Number(m[2]);
    if (mo >= 1 && mo <= 12 && dd >= 1 && dd <= 31) return `${pad2(mo)}.${pad2(dd)}`;
  }
  return stem || '未命名';
}

function allBatchNames() {
  const set = new Set();
  state.words.forEach(w => { if (w.day) set.add(String(w.day)); });
  (state.batchNames || []).forEach(n => { if (n) set.add(n); });
  return [...set].sort(natCompare);
}

function batchCount(name) {
  return state.words.filter(w => String(w.day) === String(name)).length;
}

async function saveBatchNames() {
  await dbPutMany('meta', [{ k: 'batches', list: state.batchNames || [] }]);
}

async function createBatch(name) {
  const n = String(name || '').trim();
  if (!n) { toast('批次名不能为空'); return false; }
  state.batchNames = state.batchNames || [];
  if (!state.batchNames.includes(n)) { state.batchNames.push(n); await saveBatchNames(); }
  await reloadAll();
  state.day = n;
  updateDaySelect();
  renderColumns();
  return true;
}

async function renameBatch(oldName, newName) {
  const to = String(newName || '').trim();
  if (!to) { toast('新名字不能为空'); return false; }
  if (to === oldName) return true;
  const affected = state.words.filter(w => String(w.day) === String(oldName));
  const olds = affected.map(w => w.id);
  const news = affected.map(w => ({ ...w, id: `${to}|${w.word}`, day: to }));
  if (olds.length) await dbDeleteMany('words', olds);
  if (news.length) await dbPutMany('words', news);
  state.batchNames = (state.batchNames || []).map(n => (n === oldName ? to : n));
  if (!affected.length && !state.batchNames.includes(to)) state.batchNames.push(to);
  await saveBatchNames();
  if (state.day === oldName) state.day = to;
  await reloadAll();
  return true;
}

async function deleteBatch(name) {
  const affected = state.words.filter(w => String(w.day) === String(name));
  if (affected.length) await dbDeleteMany('words', affected.map(w => w.id));
  state.batchNames = (state.batchNames || []).filter(n => n !== name);
  await saveBatchNames();
  if (state.day === name) state.day = '';
  await reloadAll();
  return affected.length;
}

/* ============================ 编码 / 分隔符 / 列推断 ============================ */
async function readTextSmart(file) {
  const buf = await file.arrayBuffer();
  const b = new Uint8Array(buf);
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
  if (b[0] === 0xEF && b[1] === 0xBB) return new TextDecoder('utf-8').decode(buf);
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(buf);
  } catch (e) {
    try { return new TextDecoder('gbk').decode(buf); }
    catch (e2) { return new TextDecoder('utf-8').decode(buf); }
  }
}

function escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function sniffDelimiter(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim()).slice(0, 30);
  if (!lines.length) return ',';
  const cands = [',', '\t', ';', '|'];
  let best = null, bestScore = 0;
  for (const d of cands) {
    const counts = lines.map(l => (l.match(new RegExp(escapeReg(d), 'g')) || []).length);
    const nz = counts.filter(c => c > 0);
    if (!nz.length) continue;
    const avg = nz.reduce((a, c) => a + c, 0) / nz.length;
    const variance = counts.reduce((a, c) => a + (c - avg) ** 2, 0) / counts.length;
    const score = avg * 10 - variance;
    if (score > bestScore) { bestScore = score; best = d; }
  }
  if (best) return best;
  // 多空格分隔
  if (lines.some(l => /\S {2,}\S/.test(l))) return 'SPACE';
  return 'SPACE';
}

function splitLines(text, delim) {
  if (delim === 'SPACE') {
    return text.split(/\r?\n/)
      .map(l => l.trim())
      .filter(Boolean)
      .map(l => l.split(/\s{2,}|\t/).map(s => s.trim()).filter(s => s !== ''));
  }
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

const IPA_RE = /[ˈˌəʃθðŋæɔɪʊɑɜʌːˈ]/;
function looksPhonetic(v) {
  return /^[\/\[\(].*[\/\]\)]$/.test(v) || IPA_RE.test(v) || /^[a-zəʃθðŋæˈˌːʌɒɪʊɛɔ]+$/.test(v) && IPA_RE.test(v);
}
function looksDate(v) {
  return /^(?:\d{1,2}[.\-\/月]\d{1,2}日?|\d{4}[.\-]\d{1,2}[.\-]\d{1,2}|day\s*\d+|第\s*\d+\s*天|\d+\s*单元)$/i.test(v);
}
function looksCJK(v) { return /[\u4e00-\u9fa5]/.test(v); }
function looksWord(v) { return /^[A-Za-z][A-Za-z'’\-.\s]{0,40}$/.test(v) && /[A-Za-z]{2,}/.test(v); }

function inferColumns(rows) {
  const width = Math.max(...rows.slice(0, 30).map(r => r.length));
  const score = [];
  for (let c = 0; c < width; c++) {
    const s = { c, word: 0, meaning: 0, phonetic: 0, day: 0, n: 0 };
    rows.slice(0, 40).forEach(r => {
      const v = String(r[c] ?? '').trim();
      if (!v) return;
      s.n++;
      if (looksDate(v)) s.day++;
      else if (looksPhonetic(v)) s.phonetic++;
      else if (looksCJK(v)) s.meaning++;
      else if (looksWord(v)) s.word++;
    });
    score.push(s);
  }
  const pick = (key) => {
    const sorted = [...score].filter(s => s[key] > 0).sort((a, b) => b[key] - a[key]);
    return sorted.length ? sorted[0].c : -1;
  };
  const map = {};
  map.day = pick('day');
  map.phonetic = pick('phonetic');
  map.meaning = pick('meaning');
  map.word = pick('word');
  // 释义列被音标占用时回退
  if (map.meaning === map.phonetic) map.meaning = -1;
  if (map.word < 0) {
    const rest = score.filter(s => ![map.day, map.phonetic, map.meaning].includes(s.c) && s.n > 0);
    if (rest.length) map.word = rest.sort((a, b) => b.n - a.n)[0].c;
  }
  return map;
}

/* 把表格行转成词条：优先用表头，否则按内容推断 */
function parseRowsToWords(rows) {
  if (!rows || !rows.length) throw new Error('文件是空的');
  const headerIdx = mapHeaders(rows[0]);
  const hasHeader = Object.keys(headerIdx).length >= 2;
  let map = headerIdx;
  let start = 1;
  if (!hasHeader) {
    map = inferColumns(rows);
    start = 0;
  }
  if (map.word === undefined || map.word < 0) {
    const width = Math.max.apply(null, rows.slice(0, 20).map(r => (r || []).length));
    if (!hasHeader && width >= 1) {
      // 只有一列、或每格把单词/音标/释义混在一起 → 交给 splitMixed 拆
      map = { word: 0, phonetic: -1, meaning: -1, day: -1 };
    } else {
      throw new Error('认不出“单词”在哪一列，请在预览里手动指定');
    }
  }
  const singleCol = (map.phonetic === undefined || map.phonetic < 0) &&
    (map.meaning === undefined || map.meaning < 0);
  const out = [];
  for (let i = start; i < rows.length; i++) {
    const r = rows[i];
    if (!r || !r.length) continue;
    const get = (k) => (map[k] >= 0 && map[k] !== undefined ? String(r[map[k]] ?? '').trim() : '');
    const raw = get('word');
    if (!raw) continue;
    let rec;
    if (singleCol || CJK_RE.test(raw)) {
      // 这一格把单词/音标/释义混在一起 → 智能拆开
      const sp = splitMixed(raw);
      rec = {
        day: get('day'),
        word: sp.word || raw,
        phonetic: get('phonetic') || sp.phonetic,
        pos: get('pos'),
        meaning: get('meaning') || sp.meaning
      };
    } else {
      rec = { day: get('day'), word: raw, phonetic: get('phonetic'), pos: get('pos'), meaning: get('meaning') };
    }
    if (!rec.word) continue;
    // 拆词性：单词尾部 ,n. / 释义开头 v.
    const ex = extractPos(rec.word, rec.meaning);
    out.push({
      day: rec.day,
      word: ex.word || rec.word,
      phonetic: rec.phonetic,
      pos: (rec.pos || '') || ex.pos || '',
      meaning: ex.meaning !== undefined ? ex.meaning : rec.meaning
    });
  }
  if (!out.length) throw new Error('没有识别到有效单词行');
  return { words: out, hasHeader, map };
}

/* ============================ 导入流程 ============================ */
async function readTable(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
    const XLSX = await loadSheetJS();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
    return rows.filter(r => r.some(c => String(c).trim() !== ''));
  }
  if (name.endsWith('.json')) {
    const text = await readTextSmart(file);
    const data = JSON.parse(text);
    const arr = Array.isArray(data) ? data : (data.words || []);
    return [['day', 'word', 'phonetic', 'meaning']].concat(
      arr.map(w => [w.day ?? '', w.word ?? '', w.phonetic ?? '', w.meaning ?? ''])
    );
  }
  const text = await readTextSmart(file);
  const delim = sniffDelimiter(text);
  return splitLines(text, delim);
}

async function importFiles(fileList) {
  const files = [...fileList];
  if (!files.length) return;
  const items = [];
  for (const f of files) {
    const item = { file: f, name: f.name, batch: batchNameFromFile(f.name), checked: true };
    try {
      const rows = await readTable(f);
      const parsed = parseRowsToWords(rows);
      item.words = parsed.words;
      item.hasHeader = parsed.hasHeader;
      item.error = null;
    } catch (e) {
      item.words = [];
      item.error = e.message || String(e);
      item.checked = false;
    }
    items.push(item);
  }
  showImportPreview(items);
}

    });

async function doImport(items, mask) {
  if (mask) mask.remove();
  const chosen = items.filter(i => i.checked && !i.error);
  const existing = new Map(state.words.map(w => [w.id, w]));
  const seen = new Set();
  const toPut = [];
  const addedIds = [];
  const patched = [];
  let added = 0, filled = 0, skipped = 0;

  chosen.forEach(it => {
    it.words.forEach(w => {
      const day = w.day || it.batch;
      const id = `${day}|${w.word}`;
      const cur = existing.get(id);
      if (cur) {
        const patch = { ...cur };
        let changed = false;
        if (!patch.phonetic && w.phonetic) { patch.phonetic = w.phonetic; changed = true; }
        if (!patch.meaning && w.meaning) { patch.meaning = w.meaning; changed = true; }
        if (changed) { toPut.push(patch); patched.push({ id: patch.id, phonetic: cur.phonetic, meaning: cur.meaning }); filled++; }
        else skipped++;
        return;
      }
      if (seen.has(id)) { skipped++; return; }
      seen.add(id);
      toPut.push({
        id, day, word: w.word, phonetic: w.phonetic || '', pos: w.pos || '', meaning: w.meaning || '',
        status: 'learning', folderId: null, createdAt: Date.now() + addedIds.length
      });
      addedIds.push(id);
      added++;
    });
  });

  if (toPut.length) await dbPutMany('words', toPut);
  // 记住批次名（即使空批也保留）
  state.batchNames = state.batchNames || [];
  // 只登记真正用到的批次（避免文件名批次变成空批）
  const usedBatches = new Set();
  chosen.forEach(it => it.words.forEach(w => usedBatches.add(w.day || it.batch)));
  [...usedBatches].forEach(b => { if (!state.batchNames.includes(b)) state.batchNames.push(b); });
  await saveBatchNames();
  await reloadAll();

  openModal({
    title: '导入完成',
    bodyHTML: `新增 <b>${added}</b> 条${filled ? `，补全 <b>${filled}</b> 条` : ''}${skipped ? `，跳过 <b>${skipped}</b> 条（已存在）` : ''}`,
    actions: [
      { text: '知道了' },
      { text: '撤销这次导入', danger: true, onClick: async () => {
          if (addedIds.length) await dbDeleteMany('words', addedIds);
          if (patched.length) {
            const map = new Map(state.words.map(w => [w.id, w]));
            const restore = patched.map(p => ({ ...map.get(p.id), phonetic: p.phonetic, meaning: p.meaning })).filter(w => w.id);
            if (restore.length) await dbPutMany('words', restore);
          }
          await reloadAll();
          toast('已撤销本次导入');
        } }
    ]
  });
}


/* ============================ 在线补音标 ============================ */
const IPA_API = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
const ipaCache = new Map();

function normalizeIpa(s) {
  let t = String(s || '').trim();
  if (!t) return '';
  t = t.replace(/^\[|\]$/g, '/');
  if (t[0] !== '/') t = '/' + t;
  if (t[t.length - 1] !== '/') t = t + '/';
  return t.replace(/\/{2,}/g, '/');
}

/* ---------- ARPAbet → IPA（Datamuse 兜底用） ---------- */
const ARPA_V = { AA: 'ɑ', AE: 'æ', AH: 'ʌ', AO: 'ɔ', AW: 'aʊ', AY: 'aɪ', EH: 'ɛ', ER: 'ɜːr',
  EY: 'eɪ', IH: 'ɪ', IY: 'iː', OW: 'oʊ', OY: 'ɔɪ', UH: 'ʊ', UW: 'uː' };
const ARPA_C = { B: 'b', CH: 'tʃ', D: 'd', DH: 'ð', F: 'f', G: 'ɡ', HH: 'h', JH: 'dʒ', K: 'k',
  L: 'l', M: 'm', N: 'n', NG: 'ŋ', P: 'p', R: 'r', S: 's', SH: 'ʃ', T: 't', TH: 'θ',
  V: 'v', W: 'w', Y: 'j', Z: 'z', ZH: 'ʒ' };

function arpaToIpa(pron) {
  const toks = String(pron || '').trim().split(/\s+/);
  const items = [];
  toks.forEach(t => {
    const m = t.match(/^([A-Z]+)([012])?$/);
    if (!m) return;
    const base = m[1], st = m[2] ? Number(m[2]) : null;
    if (ARPA_V[base]) {
      let sym = ARPA_V[base];
      if (st === 0) {
        if (base === 'AH') sym = 'ə';
        else if (base === 'ER') sym = 'ər';
        else if (base === 'IY') sym = 'i';
        else if (base === 'UW') sym = 'u';
      }
      items.push({ v: true, sym, stress: st });
    } else if (ARPA_C[base]) {
      items.push({ v: false, sym: ARPA_C[base] });
    }
  });
  if (!items.some(i => i.v)) return '';
  let out = '', pending = [];
  items.forEach(it => {
    if (it.v) {
      const mark = it.stress === 1 ? 'ˈ' : it.stress === 2 ? 'ˌ' : '';
      out += mark + pending.join('') + it.sym;
      pending = [];
    } else pending.push(it.sym);
  });
  out += pending.join('');
  return '/' + out + '/';
}

async function datamuseIpa(word) {
  try {
    const res = await fetch('https://api.datamuse.com/words?sp=' + encodeURIComponent(word) + '&md=r&max=3');
    if (!res.ok) return '';
    const arr = await res.json();
    for (const item of (arr || [])) {
      if (String(item.word).toLowerCase() !== String(word).toLowerCase()) continue;
      const tag = (item.tags || []).find(t => String(t).startsWith('pron:'));
      if (tag) {
        const ipa = arpaToIpa(tag.slice(5));
        if (ipa) return ipa;
      }
    }
    return '';
  } catch (e) { return ''; }
}

/* 用 Datamuse 的 tags 取词性：n / v / adj / adv */
const POS_TAG_MAP = { n: 'n.', v: 'v.', adj: 'adj.', adv: 'adv.' };
const posCache = new Map();

async function datamusePos(word) {
  const w = String(word || '').trim().toLowerCase().replace(/[^a-z'\-]/g, '');
  if (!w || /\s/.test(w)) return '';
  if (posCache.has(w)) return posCache.get(w);
  try {
    const res = await fetch('https://api.datamuse.com/words?sp=' + encodeURIComponent(w) + '&md=p&max=3');
    if (!res.ok) { posCache.set(w, ''); return ''; }
    const arr = await res.json();
    let out = '';
    for (const it of (arr || [])) {
      if (String(it.word).toLowerCase() !== w) continue;
      const tags = it.tags || [];
      let hit = '';
      for (const t of tags) {
        const k = String(t).toLowerCase().trim();
        if (POS_TAG_MAP[k]) { hit = POS_TAG_MAP[k]; break; }
      }
      if (hit) { out = hit; break; }
    }
    posCache.set(w, out);
    return out;
  } catch (e) { return ''; }
}

async function dictApiIpa(w) {
  try {
    const res = await fetch(IPA_API + encodeURIComponent(w), { headers: { Accept: 'application/json' } });
    if (!res.ok) return '';
    const data = await res.json();
    const texts = [];
    (Array.isArray(data) ? data : []).forEach(e => (e.phonetics || []).forEach(p => { if (p.text) texts.push(p.text); }));
    const pick = texts.find(t => t.startsWith('/')) || texts[0] || '';
    return normalizeIpa(pick);
  } catch (e) { return ''; }
}

async function lookupWordIpa(word) {
  const w = String(word || '').trim().toLowerCase().replace(/[^a-z'\-]/g, '');
  if (!w) return '';
  if (ipaCache.has(w)) return ipaCache.get(w);
  // 先用 Datamuse（ARPAbet 一致性好），失败再退回 dictionaryapi
  let ipa = await datamuseIpa(w).catch(() => '');
  if (!ipa) ipa = await dictApiIpa(w);
  ipaCache.set(w, ipa);
  return ipa;
}

async function lookupIpa(text) {
  const t = String(text || '').trim();
  if (!t) return '';
  if (!/\s/.test(t)) return lookupWordIpa(t);
  const parts = t.split(/\s+/).filter(Boolean);
  if (parts.length > 5) return '';
  const out = [];
  for (const p of parts) {
    const ipa = await lookupWordIpa(p);
    if (!ipa) return '';
    // 短语里去掉重音符，读起来更干净
    out.push(ipa.replace(/[ˈˌ]/g, '').replace(/^\//, '').replace(/\/$/, ''));
  }
  return '/' + out.join(' ') + '/';
}

async function runWithLimit(items, limit, fn, onDone) {
  let i = 0, done = 0;
  const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (i < items.length) {
      const item = items[i++];
      try { await fn(item); } catch (e) { }
      done++;
      if (onDone) onDone(done);
    }
  });
  await Promise.all(workers);
}

function autoFillPhonetic() {
  const missPh = state.words.filter(w => !w.phonetic);
  const missPos = state.words.filter(w => !w.pos && !/\s/.test(w.word));
  const targets = state.words.filter(w => !w.phonetic || (!w.pos && !/\s/.test(w.word)));
  if (!targets.length) { toast('音标和词性都已经齐了'); return; }
  const single = targets.filter(w => !/\s/.test(w.word));
  const phrase = targets.filter(w => /\s/.test(w.word));
  openModal({
    title: '在线补全（音标 + 词性）',
    bodyHTML: '共 <b>' + targets.length + '</b> 个词待补：' +
      '<br>· 缺音标 <b>' + missPh.length + '</b> 个' +
      '<br>· 缺词性 <b>' + missPos.length + '</b> 个（短语不补词性）' +
      '<br><br>其中单词 <b>' + single.length + '</b> 个、短语 <b>' + phrase.length + '</b> 个。' +
      '需要联网，大约 ' + Math.max(3, Math.ceil(targets.length / 3 * 0.6)) + ' 秒。查不到的会跳过，不影响已有数据。',
    actions: [
      { text: '取消' },
      { text: '开始补全', primary: true, onClick: () => doFillPhonetic(targets) }
    ]
  });
}

async function doFillPhonetic(targets) {
  const mask = openModal({
    title: '正在补全…',
    bodyHTML: '<div id="fp">0 / ' + targets.length + '</div>',
    actions: []
  });
  const updates = [];
  let okPh = 0, okPos = 0;
  const flush = async () => {
    if (!updates.length) return;
    const b = updates.splice(0, updates.length);
    await dbPutMany('words', b);
  };
  await runWithLimit(targets, 3, async (w) => {
    const patch = Object.assign({}, w);
    let changed = false;
    if (!w.phonetic) {
      const ipa = await lookupIpa(w.word);
      if (ipa) { patch.phonetic = ipa; okPh++; changed = true; }
    }
    if (!w.pos && !/\s/.test(w.word)) {
      const p = await datamusePos(w.word);
      if (p) { patch.pos = p; okPos++; changed = true; }
    }
    if (changed) updates.push(patch);
    if (updates.length >= 20) await flush();
  }, (done) => {
    if (mask) {
      const el = mask.querySelector('#fp');
      if (el) el.textContent = done + ' / ' + targets.length + '　音标 ' + okPh + '　词性 ' + okPos;
    }
  });
  await flush();
  if (mask) mask.remove();
  await reloadAll();
  const leftPh = state.words.filter(w => !w.phonetic).length;
  const leftPos = state.words.filter(w => !w.pos && !/\s/.test(w.word)).length;
  openModal({
    title: '补全完成',
    bodyHTML: '音标成功 <b>' + okPh + '</b> 个' + (leftPh ? '（还差 ' + leftPh + ' 个）' : '') +
      '<br>词性成功 <b>' + okPos + '</b> 个' + (leftPos ? '（还差 ' + leftPos + ' 个）' : '') +
      '<br><br>查不到的多是生僻词或短语，可以点卡片上的 ✎ 手动补。',
    actions: [{ text: '知道了', primary: true }]
  });
}

/* ============================ 单词编辑 / 导出 / 混合拆分 ============================ */
const PH_FIND = /[\/\[][^\/\]\s]{1,40}[\/\]]/;
const IPA_CHAR = /[ˈˌəʃθðŋæɔɪʊɑɜʌː]/;
const CJK_RE = /[\u4e00-\u9fa5]/;

/* 把 "abandon /əˈbændən/ v.放弃" 这种混在一格的拆成三部分 */
function splitMixed(t) {
  t = String(t == null ? '' : t).trim();
  let ph = '';
  const pm = t.match(PH_FIND);
  if (pm && IPA_CHAR.test(pm[0])) {
    ph = pm[0];
    t = (t.slice(0, pm.index) + ' ' + t.slice(pm.index + pm[0].length)).trim();
  }
  const ci = t.search(CJK_RE);
  let w = ci < 0 ? t : t.slice(0, ci);
  let mn = ci < 0 ? '' : t.slice(ci);
  const pos = w.match(/\s+((?:[a-z]{1,5}\.\s*)+)$/i);
  if (pos && ci >= 0) { mn = pos[1].trim() + ' ' + mn; w = w.slice(0, pos.index); }
  w = w.replace(/^[\d.\s、)）]+/, '').replace(/[\s\-–—:：,，;；]+$/, '').trim();
  return { word: w, phonetic: ph, meaning: mn.trim() };
}

async function saveWord(old, f) {
  const day = (f.day || '').trim() || state.day || '未分组';
  const word = (f.word || '').trim();
  if (!word) return toast('单词不能为空');
  const id = day + '|' + word;
  if ((!old || old.id !== id) && state.words.some(x => x.id === id)) return toast('该批次下已有同名单词');
  const base = old || { status: 'learning', folderId: null, createdAt: Date.now() };
  const rec = Object.assign({}, base, {
    id, day, word,
    phonetic: (f.phonetic || '').trim(),
    pos: (f.pos || '').trim(),
    meaning: (f.meaning || '').trim()
  });
  if (old && old.id !== id) await dbDeleteMany('words', [old.id]);
  await dbPutMany('words', [rec]);
  if (!state.batchNames.includes(day)) { state.batchNames.push(day); await saveBatchNames(); }
  state.sel.learning.clear(); state.sel.done.clear();
  await reloadAll();
  toast(old ? '已保存' : '已添加');
}

async function deleteWords(ids) {
  if (!ids || !ids.length) return;
  await dbDeleteMany('words', ids);
  state.sel.learning.clear(); state.sel.done.clear();
  await reloadAll();
  toast('已删除 ' + ids.length + ' 个单词');
}

/* 顶栏一键重命名当前批次（可合并到已有批次） */
function renameCurrentDay() {
  const old = state.day;
  if (!old) return toast('请先在日期下拉框里选中一个批次');
  openModal({
    title: '重命名批次',
    bodyHTML: '改成已有的名字，就会合并到那个批次（重复的单词保留原有那条）。',
    input: { value: old, placeholder: '新名称，例如 11.16-1' },
    actions: [{ text: '取消' }, {
      text: '确定', primary: true,
      validate: (el) => { if (!el.value.trim()) { toast('名称不能为空'); return false; } return true; },
      onClick: async (el) => {
        const nd = el.value.trim();
        if (nd === old) return;
        const mine = state.words.filter(w => String(w.day) === String(old));
        const exist = new Set(state.words.filter(w => String(w.day) === nd).map(w => w.word));
        const move = [];
        mine.forEach(w => { if (!exist.has(w.word)) move.push(Object.assign({}, w, { day: nd, id: nd + '|' + w.word })); });
        if (move.length) await dbPutMany('words', move);
        if (mine.length) await dbDeleteMany('words', mine.map(w => w.id));
        state.batchNames = state.batchNames.filter(n => n !== old);
        if (!state.batchNames.includes(nd)) state.batchNames.push(nd);
        await saveBatchNames();
        if (state.nbDay === old) state.nbDay = nd;
        state.day = nd;
        state.sel.learning.clear(); state.sel.done.clear();
        await reloadAll();
        const skipped = mine.length - move.length;
        toast('已改名为「' + nd + '」' + (skipped ? '，合并时跳过 ' + skipped + ' 个重复单词' : ''));
      }
    }]
  });
}



/* ============================ 词性 ============================ */
/* 常见词性写法：n. v. vt. vi. adj. a. ad. adv. prep. conj. pron. num. art. int. aux. abbr. phr. */
const POS_TOKEN = /^(?:n|v|vt|vi|adj|a|ad|adv|prep|conj|pron|num|art|int|aux|abbr|phr|pl|sing|复|不可数)\s*\.\s*/i;
const POS_FULL = /^(?:名词|动词|及物动词|不及物动词|形容词|副词|介词|连词|代词|数词|冠词|感叹词|助动词|短语)\s*$/;

function isPosLike(t) {
  const x = String(t || '').trim();
  if (!x) return false;
  return POS_TOKEN.test(x) || POS_FULL.test(x);
}

/* 从 “v. 放弃” 这种释义里拆出词性；也从单词尾部 “presently ,ad.” 拆 */
function extractPos(word, meaning) {
  let w = String(word || '').trim();
  let m = String(meaning || '').trim();
  let pos = '';

  // 1) 单词尾部带 ,n. /  n. 之类
  const wm = w.match(/[\s,，]*(?:[,，]\s*)?((?:n|v|vt|vi|adj|a|ad|adv|prep|conj|pron|num|art|int|aux|abbr|phr)\s*\.)\s*$/i);
  if (wm && w.length - wm[0].length >= 2) {
    pos = wm[1].replace(/\s+/g, '').toLowerCase();
    w = w.slice(0, w.length - wm[0].length).trim();
    w = w.replace(/[\s,，]+$/, '');
  }

  // 2) 释义开头带词性
  if (!pos && m) {
    const mm = m.match(/^((?:n|v|vt|vi|adj|a|ad|adv|prep|conj|pron|num|art|int|aux|abbr|phr)\s*\.)\s*/i);
    if (mm) {
      pos = mm[1].replace(/\s+/g, '').toLowerCase();
      m = m.slice(mm[0].length).trim();
    } else {
      const mf = m.match(/^(名词|动词|及物动词|不及物动词|形容词|副词|介词|连词|代词|数词|冠词|感叹词|助动词)\s*[：:，,]?\s*/);
      if (mf) { pos = mf[1]; m = m.slice(mf[0].length).trim(); }
    }
  }

  // 3) 释义里有多词性 “v. … n. …”，只取第一个
  if (pos && m) {
    m = m.replace(/^(?:n|v|vt|vi|adj|ad|adv|prep|conj|pron)\s*\.\s*/i, '');
  }
  return { word: w, pos, meaning: m };
}


/* 老数据迁移：把释义里的词性抽出来（只跑一次） */
async function migratePos() {
  try {
    const done = await dbGet('meta', 'posMigrated');
    if (done && done.v !== false) return;
    const upd = [], del = [];
    state.words.forEach(w => {
      if (w.pos) return;
      const ex = extractPos(w.word, w.meaning);
      if (!ex.pos) return;
      const nw = ex.word || w.word;
      const nid = (w.day || '') + '|' + nw;
      if (nid !== w.id) del.push(w.id);
      upd.push(Object.assign({}, w, { id: nid, word: nw, pos: ex.pos, meaning: ex.meaning }));
    });
    if (del.length) await dbDeleteMany('words', del);
    if (upd.length) await dbPutMany('words', upd);
    await dbPutMany('meta', [{ k: 'posMigrated', v: true, count: upd.length }]);
    if (upd.length) {
      await reloadAll();
      toast('已整理 ' + upd.length + ' 个单词的词性');
    }
  } catch (e) { console.error(e); }
}

async function exportBackup(mode) {

  const data = {

    scope: mode === 'undone' ? 'undone' : 'all',
    words, notebooks
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const tag = mode === 'undone' ? '未掌握' : '全部';
  a.download = `背单词备份_${tag}_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast(`已导出 ${words.length} 个单词（${tag}）`);
}

function normalizeRestoreWord(w, i) {
  return {
    id: w.id || `${w.day}|${w.word}`, day: w.day ?? '', word: w.word ?? '',
    phonetic: w.phonetic ?? '', meaning: w.meaning ?? '',
    status: w.status === 'done' ? 'done' : 'learning',
    folderId: w.folderId ?? null, createdAt: w.createdAt ?? i
  };
}

async function restoreBackup(file, mode) {
  const text = await file.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { throw new Error('不是合法的 JSON 文件。'); }
  if (!data || !Array.isArray(data.words)) throw new Error('备份格式不对：缺少 words 数组。');

  const srcWords = data.words.map((w, i) => normalizeRestoreWord(w, i));
  const srcFolders = Array.isArray(data.notebooks) && data.notebooks.length
    ? data.notebooks
    : [{ id: DEFAULT_FOLDER, name: '默认', createdAt: Date.now() }];

  if (mode === 'replace') {
    await dbClear('words');
    await dbClear('notebooks');
    await dbPutMany('notebooks', srcFolders);
    if (srcWords.length) await dbPutMany('words', srcWords);
    state.sel.learning.clear();
    state.sel.done.clear();
    await reloadAll();
    return { mode: 'replace', added: srcWords.length, filled: 0, skipped: 0 };
  }

  // 合并模式：只补不存在的，已有的保留原样（仅补空缺字段）
  const curWords = new Map((await dbGetAll('words')).map(w => [w.id, w]));
  const toPut = [];
  let added = 0, filled = 0, skipped = 0;
  srcWords.forEach((w) => {
    const cur = curWords.get(w.id);
    if (!cur) { toPut.push(w); added++; return; }
    const patch = { ...cur };
    let changed = false;
    if (!patch.phonetic && w.phonetic) { patch.phonetic = w.phonetic; changed = true; }
    if (!patch.meaning && w.meaning) { patch.meaning = w.meaning; changed = true; }
    if (changed) { toPut.push(patch); filled++; } else skipped++;
  });
  const curFolders = new Set((await dbGetAll('notebooks')).map(f => f.id));
  const newFolders = srcFolders.filter(f => !curFolders.has(f.id));
  if (newFolders.length) await dbPutMany('notebooks', newFolders);
  if (toPut.length) await dbPutMany('words', toPut);
  await reloadAll();
  return { mode: 'merge', added, filled, skipped };
}

  $('btnNewFolder').addEventListener('click', newFolder);
  $('btnDelFolder').addEventListener('click', delFolder);

  $('btnHelp').addEventListener('click', showHelp);

  $('btnImport').addEventListener('click', () => $('fileImport').click());

  $('fileImport').addEventListener('change', async e => {
    const files = [...e.target.files];
    e.target.value = '';
    if (!files.length) return;
    await importFiles(files);
  });

  // 直接把文件拖到页面上就能导入
  ['dragenter', 'dragover'].forEach(t => document.addEventListener(t, (e) => {
    e.preventDefault();
    document.body.classList.add('dragging');
  }));
  document.addEventListener('dragleave', (e) => {
    if (!e.relatedTarget) document.body.classList.remove('dragging');
  });
  document.addEventListener('drop', async (e) => {
    e.preventDefault();
    document.body.classList.remove('dragging');
    const files = [...((e.dataTransfer && e.dataTransfer.files) || [])]
      .filter(f => /\.(csv|xlsx|xls|txt|tsv|json)$/i.test(f.name));
    if (files.length) await importFiles(files);
    else toast('请拖入 csv / xlsx / xls / txt / json 文件');
  });

  $('btnExport').addEventListener('click', () => {
    const total = state.words.length;
    const undone = state.words.filter(w => w.status !== 'done').length;
    openModal({
      title: '导出备份',
      bodyHTML: `当前共 <b>${total}</b> 个单词，其中未掌握 <b>${undone}</b> 个。<br><br>` +
        '选择导出范围（生词本文件夹会一并导出）：',
      actions: [
        { text: '取消' },
        { text: '导出 Excel', onClick: () => exportSheet() },
        { text: `导出全部（${total}）`, onClick: async () => {
            try { await exportBackup('all'); }
            catch (e) { openModal({ title: '导出失败', bodyHTML: `<span class="err">${errHtml(e)}</span>`, actions: [{ text: '关闭', primary: true }] }); }
          } },
        { text: `仅未掌握（${undone}）`, primary: true, onClick: async () => {
            try { await exportBackup('undone'); }
            catch (e) { openModal({ title: '导出失败', bodyHTML: `<span class="err">${errHtml(e)}</span>`, actions: [{ text: '关闭', primary: true }] }); }
          } }
      ]
    });
  });

  $('btnRestore').addEventListener('click', () => $('fileRestore').click());
  $('fileRestore').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    openModal({
      title: '导入备份',
      bodyHTML: '请选择导入方式：<br><br>' +
        '<b>仅补充缺失</b>（推荐）：只把当前没有的单词加进来；已有的单词、学习状态、生词本<b>保持不动</b>。' +
        '<br><br><b>完全覆盖</b>：清空当前数据后，用备份文件整体替换。',
      actions: [
        { text: '取消' },
        { text: '完全覆盖', danger: true, onClick: async () => {
            try {
              const r = await restoreBackup(f, 'replace');
              toast(`已覆盖，恢复 ${r.added} 个单词`);
            } catch (err) {
              openModal({ title: '恢复失败', bodyHTML: `<span class="err">${errHtml(err)}</span>`, actions: [{ text: '关闭', primary: true }] });
            }
          } },
        { text: '仅补充缺失', primary: true, onClick: async () => {
            try {
              const r = await restoreBackup(f, 'merge');
              openModal({
                title: '补充完成',
                bodyHTML: `新增 <b>${r.added}</b> 个单词` +
                  (r.filled ? `；补全 <b>${r.filled}</b> 个（原来缺音标/释义）` : '') +
                  (r.skipped ? `；跳过 <b>${r.skipped}</b> 个（已存在，保持不变）` : ''),
                actions: [{ text: '知道了', primary: true }]
              });
            } catch (err) {
              openModal({ title: '恢复失败', bodyHTML: `<span class="err">${errHtml(err)}</span>`, actions: [{ text: '关闭', primary: true }] });
            }
          } }
      ]
    });
  });

  $('btnPhonetic').addEventListener('click', autoFillPhonetic);
  $('btnAdd').addEventListener('click', () => openWordEditor(null));
  $('btnRenameDay').addEventListener('click', renameCurrentDay);

  $('btnClear').addEventListener('click', () => {
    openModal({
      title: '清空全部数据',
      bodyHTML: '将删除<b>所有单词、学习状态、生词本</b>，且不可恢复。\n建议先导出备份。',
      actions: [
        { text: '取消' },
        { text: '确定清空', danger: true, onClick: async () => {
            await dbClear('words'); await dbClear('notebooks');
            state.sel.learning.clear(); state.sel.done.clear();
            state.day = ''; state.keyword = ''; state.nbDay = '';
            $('searchInput').value = '';
            await reloadAll();
            toast('已清空');
          } }
      ]
    });
  });
}

/* ============================ 小工具 ============================ */
function errHtml(e) {
  return escapeHtml(String((e && e.message) || e)).replace(/\n/g, '<br>');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

/* ============================ 启动 ============================ */
(async function init() {
  bind();
  await reloadAll();
  await migratePos();
})();
</script>
</body>
</html>
